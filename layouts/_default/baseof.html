<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode | default "en" }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  {{ with .Permalink }}<link rel="canonical" href="{{ . }}">{{ end }}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  {{ $css := resources.Get "css/main.css" | minify }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}">
  {{ with .Site.Params.favicon }}<link rel="icon" href="{{ . }}">{{ end }}
</head>
<body>
  {{ partial "nav.html" . }}
  {{ block "main" . }}{{ end }}
  {{ partial "footer.html" . }}
  {{ partial "search.html" . }}
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
  <script>
  (function () {
    const overlay     = document.getElementById('search-overlay');
    const modalInput  = document.getElementById('search-modal-input');
    const resultsEl   = document.getElementById('search-results');
    const emptyEl     = document.getElementById('search-empty');
    const closeBtn    = document.getElementById('search-close');

    let fuse = null;
    let loaded = false;

    // Trigger inputs: nav + sidebar
    document.querySelectorAll('.nav-search input, .search-box').forEach(input => {
      input.addEventListener('focus', openOverlay);
      input.addEventListener('input', e => {
        openOverlay();
        modalInput.value = e.target.value;
        doSearch(e.target.value);
      });
    });

    function openOverlay() {
      overlay.removeAttribute('aria-hidden');
      overlay.classList.add('open');
      modalInput.focus();
      if (!loaded) loadIndex();
    }

    function closeOverlay() {
      overlay.setAttribute('aria-hidden', 'true');
      overlay.classList.remove('open');
      modalInput.value = '';
      resultsEl.innerHTML = '';
      resultsEl.appendChild(emptyEl);
      emptyEl.textContent = 'Start typing to search...';
    }

    closeBtn.addEventListener('click', closeOverlay);
    overlay.addEventListener('click', e => { if (e.target === overlay) closeOverlay(); });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeOverlay();
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); openOverlay(); }
    });

    modalInput.addEventListener('input', e => doSearch(e.target.value));

    function loadIndex() {
      loaded = true;
      fetch('/index.json')
        .then(r => r.json())
        .then(data => {
          fuse = new Fuse(data, {
            keys: [
              { name: 'title',      weight: 0.5 },
              { name: 'tags',       weight: 0.3 },
              { name: 'summary',    weight: 0.15 },
              { name: 'categories', weight: 0.05 }
            ],
            threshold: 0.35,
            includeMatches: true,
            minMatchCharLength: 2
          });
          if (modalInput.value) doSearch(modalInput.value);
        })
        .catch(() => {
          emptyEl.textContent = 'Could not load search index.';
        });
    }

    function doSearch(query) {
      resultsEl.innerHTML = '';

      if (!query || query.length < 2) {
        emptyEl.textContent = 'Start typing to search...';
        resultsEl.appendChild(emptyEl);
        return;
      }

      if (!fuse) {
        emptyEl.textContent = 'Loading index...';
        resultsEl.appendChild(emptyEl);
        return;
      }

      const hits = fuse.search(query, { limit: 8 });

      if (!hits.length) {
        emptyEl.textContent = 'No results for "' + query + '"';
        resultsEl.appendChild(emptyEl);
        return;
      }

      hits.forEach(({ item }) => {
        const el = document.createElement('a');
        el.className = 'search-result-item';
        el.href = item.url;

        const tags = (item.tags || []).slice(0, 3)
          .map(t => '<span class="tag">#' + t + '</span>').join('');

        el.innerHTML =
          '<div class="sr-title">' + item.title + '</div>' +
          '<div class="sr-meta">' +
            '<span class="sr-date">' + (item.date || '') + '</span>' +
            '<div class="sr-tags">' + tags + '</div>' +
          '</div>' +
          '<div class="sr-summary">' + (item.summary || '').slice(0, 120) + '…</div>';

        resultsEl.appendChild(el);
      });
    }
  })();
  </script>
</body>
</html>
