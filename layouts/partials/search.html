<div class="search-overlay" id="search-overlay" aria-hidden="true">
  <div class="search-modal">
    <div class="search-modal-header">
      <span class="search-modal-icon">⌕</span>
      <input
        type="search"
        class="search-modal-input"
        id="search-modal-input"
        placeholder="{{ T "search_placeholder" | default "Search posts, tags, topics..." }}"
        autocomplete="off"
        spellcheck="false"
      >
      <kbd class="search-esc" id="search-close">esc</kbd>
    </div>
    <div class="search-results" id="search-results">
      <div class="search-empty" id="search-empty">{{ T "search_empty_state" | default "Start typing to search..." }}</div>
    </div>
  </div>
</div>
