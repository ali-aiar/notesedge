{{ define "main" }}
<div class="not-found-wrapper">
  <div class="not-found-code">404</div>
  <h1 class="not-found-title">{{ T "page_not_found" | default "Page Not Found" }}</h1>
  <p class="not-found-msg">{{ T "page_not_found_message" | default "The page you're looking for doesn't exist or has been moved." }}</p>
  <a href="{{ .Site.BaseURL }}" class="not-found-btn">{{ T "back_to_home" | default "← Back to Home" }}</a>
</div>
{{ end }}
