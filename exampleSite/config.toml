baseURL = "https://example.com"
title   = "yoursite.dev"
languageCode = "en-us"
theme   = "notesedge"
paginate = 10

[taxonomies]
  tag          = "tags"
  category     = "categories"
  content_type = "content_types"

[params]
  show_hero     = true
  google_fonts  = true
  carousel_page_size = 4
  author        = "Your Name"
  tagline     = "I build things and write about <strong>how they work.</strong>"
  description = "Backend systems, distributed architecture, and the occasional deep-dive into robotics, embedded systems & industrial IoT."
  role        = "Engineer @ Company"
  location    = "City, Country"
  education   = "University, Degree"

  hero_status = "Open to opportunities"

  favicon  = "/favicon.svg"
  logo     = "/logo-brand.png"

  github   = "https://github.com/yourusername"
  linkedin = "https://linkedin.com/in/yourusername"
  email    = "you@example.com"
  theme_repo = "https://github.com/ali-aiar/notesedge"
  show_theme_credit = true

  [params.hero_code]
    language = "cpp"        # go, rust, cpp, c, javascript, typescript, python
    code     = '''
#include <string>
#include <vector>

struct Engineer {
    std::string name = "Your Name";
    std::string role = "Controls & Embedded Engineer";
    std::vector<std::string> focus = {
        "Controls",
        "Robotics",
        "Embedded Systems",
    };
    bool writing = true;
};
'''

  [params.categories]
    robotics     = { color = "#2dd4bf", from = "#1d4ed8", to = "#0a1128", label = "ROS2"   }
    embedded     = { color = "#f97316", from = "#b45309", to = "#1c0f00", label = "ESP32"  }
    "go/backend" = { color = "#00ACD7", from = "#00ACD7", to = "#003B52", label = "Go"     }
    "ai/ml"      = { color = "#7c3aed", from = "#7c3aed", to = "#1a0a2e", label = "ML"     }
    "cloud/iot"  = { color = "#FF9900", from = "#0f766e", to = "#042f2e", label = "IoT"    }
    devops       = { color = "#326CE5", from = "#2088FF", to = "#0a1128", label = "DevOps" }

[markup.highlight]
  style     = "github-dark"
  noClasses = true

[outputs]
  home = ["HTML", "RSS", "JSON"]


[permalinks]
  [permalinks.term]
    content_types = "/:slug/"

[menu]
  [[menu.main]]
    name   = "Home"
    url    = "/"
    weight = 1
  [[menu.main]]
    name   = "Notes"
    url    = "/notes/"
    weight = 2
  [[menu.main]]
    name   = "About"
    url    = "/about/"
    weight = 3
