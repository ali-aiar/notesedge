baseURL = "https://example.com"
title   = "yoursite.dev"
languageCode = "en-us"
theme   = "notesedge"
paginate = 10

[taxonomies]
  tag          = "tags"
  category     = "categories"
  content_type = "content_types"

[params]
  show_hero     = true
  google_fonts  = true
  carousel_page_size = 4
  author        = "Your Name"
  tagline     = "I build things and write about <strong>how they work.</strong>"
  description = "Backend systems, distributed architecture, and the occasional deep-dive into robotics, embedded systems & industrial IoT."
  role        = "Engineer @ Company"
  location    = "City, Country"
  education   = "University, Degree"

  hero_status = "Open to opportunities"

  favicon  = "/favicon.svg"
  logo     = "/logo-brand.png"

  github   = "https://github.com/yourusername"
  linkedin = "https://linkedin.com/in/yourusername"
  email    = "you@example.com"
  theme_repo = "https://github.com/ali-aiar/notesedge"
  show_theme_credit = true

  code_filename = "profile.go"
  code_name     = "Your Name"
  code_role     = "Software Engineer"
  code_focus    = ["Backend", "IoT", "Distributed Systems"]
  code_writing  = true

  [params.category_colors]
    robotics     = "#2dd4bf"
    embedded     = "#f97316"
    "go/backend" = "#00ACD7"
    "ai/ml"      = "#7c3aed"
    "cloud/iot"  = "#FF9900"
    devops       = "#326CE5"

  [params.category_thumb_classes]
    robotics     = "thumb-ros"
    embedded     = "thumb-embed"
    "go/backend" = "thumb-go"
    "ai/ml"      = "thumb-ml"
    "cloud/iot"  = "thumb-iot"
    devops       = "thumb-devops"

[markup.highlight]
  style     = "github-dark"
  noClasses = true

[outputs]
  home = ["HTML", "RSS", "JSON"]


[permalinks]
  [permalinks.term]
    content_types = "/:slug/"

[menu]
  [[menu.main]]
    name   = "Home"
    url    = "/"
    weight = 1
  [[menu.main]]
    name   = "Notes"
    url    = "/notes/"
    weight = 2
  [[menu.main]]
    name   = "About"
    url    = "/about/"
    weight = 3
