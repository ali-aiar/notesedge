# Hero code block language presets
# Each key is a language identifier used for two things:
#   1. The default filename shown in the code-block header
#   2. The Hugo chroma lexer name passed to `highlight` for syntax highlighting
#
# Both must match Hugo's chroma lexers:
#   go, rust, cpp, c, javascript, typescript, python, etc.
#
# Users provide the actual code via the `code` field in [params.hero_code]
# in their site config — paste any snippet, no field-by-field config needed.

[go]
filename = "profile.go"

[rust]
filename = "profile.rs"

[cpp]
filename = "profile.cpp"

[c]
filename = "profile.h"

[javascript]
filename = "profile.js"

[js]
filename = "profile.js"

[typescript]
filename = "profile.ts"

[ts]
filename = "profile.ts"

[python]
filename = "profile.py"
